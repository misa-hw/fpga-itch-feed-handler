# Model, network and hardware test suites on every push and pull request.
# The OxCaml compiler and the Jane Street preview packages come from the
# OxCaml opam repository, pinned to the commit the project was developed
# against; the switch is cached, so only the first run (or a bump of
# SWITCH_KEY) builds it. Tests that need the Nasdaq sample or the pcaps made
# from it skip themselves: the data is not redistributed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# one run at a time per branch: a second push waits for the first, which
# may be building the switch, instead of building it again in parallel
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

env:
  OPAMYES: "1"
  OPAMCONFIRMLEVEL: unsafe-yes
  OX_REPO: git+https://github.com/oxcaml/opam-repository.git#f1bd228dda31430bf6271f0f9adb2e604c6957ca
  PACKAGES: >-
    dune.3.24.2
    core core_unix hardcaml hardcaml_waveterm hardcaml_verilator jane_rope
    ppx_hardcaml ppx_jane ppx_expect
  SWITCH_KEY: oxcaml-5.2.0-f1bd228-v2

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # the hosted runner's disk fills up while building the OxCaml switch;
        # these preinstalled toolchains are not used here
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bubblewrap rsync patch unzip pkg-config libgmp-dev libffi-dev zlib1g-dev
          # Ubuntu's opam (2.1) cannot fetch a git repository pinned to a commit
          sudo curl -fsSL -o /usr/local/bin/opam \
            https://github.com/ocaml/opam/releases/download/2.5.0/opam-2.5.0-x86_64-linux
          sudo chmod +x /usr/local/bin/opam
          opam --version

      - name: Restore the OxCaml switch
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: ${{ env.SWITCH_KEY }}-${{ runner.os }}

      - name: Build the OxCaml switch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare --disable-sandboxing --no-setup
          opam switch create oxcaml --packages ocaml-variants.5.2.0+ox \
            --repos "ox=$OX_REPO,default"
          opam install --switch=oxcaml $PACKAGES
          opam clean --download-cache --logs
          rm -rf ~/.opam/oxcaml/.opam-switch/sources ~/.opam/oxcaml/.opam-switch/build
          du -sh ~/.opam

      # saved straight away, so a failing test step does not throw an hour of
      # compiling away (actions/cache only saves after a successful job)
      - name: Save the OxCaml switch
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ env.SWITCH_KEY }}-${{ runner.os }}

      - name: Versions
        run: opam list --switch=oxcaml ocaml-variants dune hardcaml core

      - name: Test
        run: make test
